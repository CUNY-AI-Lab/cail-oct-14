<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estimated carbon footprint</title>
  <!-- Opened in the slide 4 overlay. Reveal.js 5.1.0 only previews links that
       start with http, and shows a bare image in the corner, so the image
       gets this page. -->
  <style>
    html, body { height: 100%; margin: 0; background: #111111; }
    body { display: grid; place-items: center; }
    img { max-width: 88%; max-height: 88%; border-radius: 10px; }
  </style>
</head>
<body>
  <img src="images/carbon-footprint.png" alt="A Sandbox response from Mistral Large 3 with its estimate underneath: 0.19 to 0.31 grams of CO2e, 0.40 to 0.66 watt-hours, about 1.26 breaths">
  <script>
    // Keys typed inside the overlay land here, not in the deck, so pass Esc
    // back to reveal.js through its postMessage API.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ method: 'closeOverlay', args: [] }), '*');
      }
    });
  </script>
</body>
</html>
